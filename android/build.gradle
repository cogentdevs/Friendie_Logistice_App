buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.10"
        // Compile GPS and Maps against the same Location API (class/interface ABI).
        playServicesLocationVersion = "21.3.0"
        googlePlayServicesLocationVersion = playServicesLocationVersion
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.google.gms:google-services:4.4.4")
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Short Windows staging also covers native-library prefab paths used by Ninja.
if (System.getProperty('os.name').toLowerCase().contains('windows')) {
    def nativeStageRoot = new File(System.getProperty('java.io.tmpdir'),
        'flnative-' + Integer.toHexString(rootDir.absolutePath.hashCode()))
    subprojects { nativeProject ->
        nativeProject.plugins.withId('com.android.library') {
            def libraryKey = nativeProject.path.replaceAll('[^a-zA-Z0-9_-]', '_')
            nativeProject.extensions.getByName('android').externalNativeBuild.cmake.buildStagingDirectory =
                new File(nativeStageRoot, libraryKey)
        }
    }
}
